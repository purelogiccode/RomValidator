name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CSharp_RomValidator.sln

      - name: Build
        run: dotnet build CSharp_RomValidator.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test CSharp_RomValidator.sln
          --configuration Release
          --no-build
          --nologo
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-${{ matrix.os }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  inspectcode:
    name: JetBrains InspectCode
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install JetBrains command-line tools
        run: dotnet tool install --global JetBrains.ReSharper.GlobalTools

      - name: Restore
        run: dotnet restore CSharp_RomValidator.sln

      - name: Run inspectcode
        shell: pwsh
        run: |
          jb inspectcode CSharp_RomValidator.sln --output "$env:RUNNER_TEMP/inspectcode.sarif" --format=Sarif --severity=WARNING --verbosity=WARN
          if ($LASTEXITCODE -ne 0) { throw "jb inspectcode failed with exit code $LASTEXITCODE." }

          $results = (Get-Content "$env:RUNNER_TEMP/inspectcode.sarif" -Raw | ConvertFrom-Json).runs[0].results
          if ($results.Count -gt 0) {
            $results | ForEach-Object {
              "{0}: {1} ({2})" -f $_.ruleId, $_.message.text,
                $_.locations[0].physicalLocation.artifactLocation.uri
            }
            throw "jb inspectcode reported $($results.Count) issue(s)."
          }
