name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v2.8.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CSharp_RomValidator.sln

      - name: Build
        run: dotnet build CSharp_RomValidator.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharp_RomValidator.sln --configuration Release --no-build --nologo

  package:
    name: Package ${{ matrix.rid }}
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "A release tag is required."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish RomValidator/RomValidator.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output publish/${{ matrix.rid }}
          --no-self-contained

      - name: Create zip and checksum
        shell: pwsh
        run: |
          $zip = "RomValidator_${{ steps.version.outputs.version }}_${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Path "$zip.sha256" -Encoding ascii

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: |
            RomValidator_*.zip
            RomValidator_*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ inputs.tag }}"
          fi
          if [ -z "$tag" ]; then
            echo "A release tag is required." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: packages

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          packages/*.zip packages/*.sha256
          --title "ROM Validator ${{ steps.version.outputs.version }}"
          --generate-notes
