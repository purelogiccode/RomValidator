name: Release

on:
  push:
    tags: ["v*", "release_*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. release_3.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CSharp_RomValidator.sln

      - name: Build
        run: dotnet build CSharp_RomValidator.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharp_RomValidator.sln --configuration Release --no-build --nologo

  package:
    name: Package ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: win-arm64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            archive: tar.gz
          - rid: osx-x64
            os: macos-15-intel
            archive: dmg
          - rid: osx-arm64
            os: macos-15
            archive: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "A release tag is required."
          }
          $version = $tag -replace '^v', '' -replace '^release_', ''
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish RomValidator/RomValidator.csproj `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            --self-contained true `
            --output "publish/${{ matrix.rid }}" `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }

      - name: Add license, readme and whatsnew to the bundle
        shell: pwsh
        run: |
          Copy-Item LICENSE.txt, ReadMe.md, WhatsNew.md "publish/${{ matrix.rid }}/"

      - name: Create Windows zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $zip = "release_${{ steps.version.outputs.version }}_${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Create Linux tar.gz
        if: matrix.archive == 'tar.gz'
        shell: pwsh
        run: |
          chmod +x "publish/${{ matrix.rid }}/RomValidator"
          $archive = "release_${{ steps.version.outputs.version }}_${{ matrix.rid }}.tar.gz"
          tar -czf $archive -C "publish/${{ matrix.rid }}" .

      - name: Create macOS disk image
        if: matrix.archive == 'dmg'
        shell: pwsh
        run: |
          $publish = "publish/${{ matrix.rid }}"
          $stage = "dmg-staging"
          $app = "$stage/ROM Validator.app"
          $contents = "$app/Contents"
          $macOs = "$contents/MacOS"
          $resources = "$contents/Resources"
          New-Item -ItemType Directory -Force -Path $macOs, $resources | Out-Null
          Copy-Item "$publish/*" $macOs -Recurse -Force

          $iconset = "$stage/AppIcon.iconset"
          New-Item -ItemType Directory -Force -Path $iconset | Out-Null
          foreach ($size in @(16, 32, 128, 256, 512)) {
            & sips -z $size $size "RomValidator/icon/icon.png" --out "$iconset/icon_${size}x${size}.png" | Out-Null
            $double = $size * 2
            & sips -z $double $double "RomValidator/icon/icon.png" --out "$iconset/icon_${size}x${size}@2x.png" | Out-Null
          }
          & iconutil -c icns $iconset -o "$resources/AppIcon.icns"

          $plist = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>ROM Validator</string>
            <key>CFBundleDisplayName</key><string>ROM Validator</string>
            <key>CFBundleIdentifier</key><string>com.purelogiccode.romvalidator</string>
            <key>CFBundleVersion</key><string>${{ steps.version.outputs.version }}</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.version.outputs.version }}</string>
            <key>CFBundleExecutable</key><string>RomValidator</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          "@
          Set-Content -Path "$contents/Info.plist" -Value $plist -Encoding utf8NoBOM
          chmod +x "$macOs/RomValidator"
          codesign --force --deep --sign - "$app"
          if ($LASTEXITCODE -ne 0) { Write-Warning "Ad-hoc codesign failed; the app may require manual approval." }

          $dmg = "release_${{ steps.version.outputs.version }}_${{ matrix.rid }}.dmg"
          hdiutil create -volname "ROM Validator" -srcfolder $app -ov -format UDZO $dmg

      - name: Create checksum
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -File -Filter "release_${{ steps.version.outputs.version }}_${{ matrix.rid }}.*" |
            Where-Object { $_.Extension -ne ".sha256" } |
            Select-Object -First 1
          if ($null -eq $artifact) { throw "Package artifact not found." }
          $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content -Path "$($artifact.FullName).sha256" -Encoding ascii

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: |
            release_*.zip
            release_*.tar.gz
            release_*.dmg
            release_*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ inputs.tag }}"
          fi
          if [ -z "$tag" ]; then
            echo "A release tag is required." >&2
            exit 1
          fi
          version="${tag#v}"
          version="${version#release_}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: packages

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          packages/*
          --title "ROM Validator ${{ steps.version.outputs.version }}"
          --generate-notes
